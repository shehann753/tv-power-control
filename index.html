<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Power Controller - HiveMQ Cloud</title>
    <!-- Paho MQTT JavaScript Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #121212;
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        background: #1e1e1e;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        text-align: center;
        width: 320px;
      }
      .status {
        font-size: 0.95rem;
        margin-bottom: 25px;
        color: #888;
      }
      .status-online {
        color: #4caf50;
        font-weight: bold;
      }
      .status-offline {
        color: #f44336;
        font-weight: bold;
      }
      .btn {
        width: 100%;
        padding: 15px;
        margin: 10px 0;
        border: none;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition:
          opacity 0.2s,
          transform 0.1s;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn-off {
        background-color: #e53935;
        color: white;
      }
      .btn-on {
        background-color: #43a047;
        color: white;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>TV Power Control</h2>
      <div id="status" class="status status-offline">
        Connecting to HiveMQ...
      </div>

      <button
        id="btnOff"
        class="btn btn-off"
        onclick="sendPowerCommand('OFF')"
        disabled
      >
        CUT TV POWER
      </button>
      <button
        id="btnOn"
        class="btn btn-on"
        onclick="sendPowerCommand('ON')"
        disabled
      >
        RESTORE TV POWER
      </button>
    </div>

    <script>
      // HiveMQ Cloud Cluster Parameters
      const HIVEMQ_HOST = "limesweat-343b2053.a01.euc1.aws.hivemq.cloud";
      const HIVEMQ_PORT = 8884; // Secure WebSockets Port
      const WS_PATH = "/mqtt";
      const TOPIC = "home/tv/power";

      // Access Credentials
      const USERNAME = "tv_admin"; // Replace with Access Management Username
      const PASSWORD = "5mzRLDYj22fWKiD"; // Replace with Access Management Password
      const CLIENT_ID = "WebDash_" + Math.random().toString(16).substr(2, 8);

      const client = new Paho.MQTT.Client(
        HIVEMQ_HOST,
        Number(HIVEMQ_PORT),
        WS_PATH,
        CLIENT_ID,
      );

      client.onConnectionLost = onConnectionLost;

      const options = {
        useSSL: true,
        userName: USERNAME,
        password: PASSWORD,
        timeout: 10,
        onSuccess: onConnect,
        onFailure: onFailure,
      };

      client.connect(options);

      function onConnect() {
        document.getElementById("status").innerText =
          "Connected (Authenticated)";
        document.getElementById("status").className = "status status-online";
        document.getElementById("btnOff").disabled = false;
        document.getElementById("btnOn").disabled = false;
      }

      function onFailure(err) {
        document.getElementById("status").innerText = "Connection Failed";
        console.error("MQTT Connect Error:", err);
      }

      function onConnectionLost(response) {
        document.getElementById("status").innerText = "Disconnected";
        document.getElementById("status").className = "status status-offline";
        document.getElementById("btnOff").disabled = true;
        document.getElementById("btnOn").disabled = true;
      }

      function sendPowerCommand(command) {
        if (!client.isConnected()) return;
        const message = new Paho.MQTT.Message(command);
        message.destinationName = TOPIC;
        client.send(message);
        console.log("Sent command:", command);
      }
    </script>
  </body>
</html>
